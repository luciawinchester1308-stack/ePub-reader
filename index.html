<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EPUB Reader</title>
<style>
[hidden]{display:none!important}
.card>button{display:block;margin:10px auto;max-width:100%}
.numin{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;padding:0 12px;font:inherit}
select.numin{width:100%;height:46px;appearance:auto;-webkit-appearance:menulist}
select.numin option,select.numin optgroup{background:var(--bg);color:var(--fg)}
.pgbtn2{flex:0 0 56px;width:56px;height:42px;padding:0;font-size:1rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#pageinfo{cursor:pointer;padding:6px 0;text-decoration:underline dotted;min-width:84px}
#pct{cursor:pointer}
.ibtn{display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bmBtn{height:34px;width:34px;min-width:34px;border-radius:10px}
#bmBtn svg{width:18px;height:18px}
#bmBtn.on svg{fill:var(--accent);stroke:var(--accent)}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;height:40px;padding:0 6px;font-size:.85rem}
.tabs button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sheet.tall{height:72vh;display:flex;flex-direction:column;overflow:hidden}
.pbody{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .t{font-size:.95rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:.75rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.item.cur .t{color:var(--accent);font-weight:600}
.item .x{height:34px;width:34px;min-width:34px;padding:0;border-radius:10px;flex:0 0 auto}
.empty{color:var(--muted);font-size:.9rem;padding:14px 2px;line-height:1.5}
.lib{text-align:left;max-height:34vh;overflow:auto;margin-top:6px}
.addrow{margin:0 0 8px}
.addrow button{width:100%}
.pgrow{display:flex;gap:8px;align-items:stretch}
.pgbtn{flex:1;min-width:0;height:54px;padding:0;font-size:1rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#pgNow{flex:1.7;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:12px;cursor:pointer;white-space:nowrap}
#pgRange{width:100%;margin:14px 0 4px;accent-color:var(--accent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#77756f;--bar:rgba(250,250,247,.95);--accent:#2f6fed;--line:#e2e0d8;--on-accent:#fff;
--fs:19px;--lh:1.65;--side:6vw;--mt:24px;--mb:16px;--ff:Georgia,'Noto Serif',serif;--align:left}
[data-theme=sepia]{--bg:#f3e8d2;--fg:#3b2f20;--muted:#8a7658;--bar:rgba(243,232,210,.95);--accent:#a4571d;--line:#dccfb4}
[data-theme=dark]{--bg:#1c1d20;--fg:#d6d6d2;--muted:#8b8b88;--bar:rgba(28,29,32,.96);--accent:#6ea0ff;--line:#33353a;--on-accent:#0b0b0c}
[data-theme=black]{--bg:#000;--fg:#bdbdb8;--muted:#6d6d6a;--bar:rgba(0,0,0,.96);--accent:#6ea0ff;--line:#222;--on-accent:#000}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
font-family:system-ui,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;
padding:0 14px;height:46px;min-width:46px;cursor:pointer}
button:active{opacity:.6}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
#reader{position:fixed;left:0;right:0;top:calc(var(--mt) + env(safe-area-inset-top));bottom:calc(var(--mb) + env(safe-area-inset-bottom));
overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
#reader::-webkit-scrollbar{width:9px}
#reader::-webkit-scrollbar-track{background:transparent}
#reader::-webkit-scrollbar-thumb{background:var(--muted);opacity:.6;border-radius:6px}
#text{position:relative;margin:0 auto;max-width:42em;
padding:56px var(--side) calc(100vh - 40px);
font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:var(--align);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
#text p{margin:0 0 .9em}
#text p.fn{font-size:.86em;line-height:1.5;color:var(--muted);border-left:2px solid var(--line);padding-left:.8em;margin:-.35em 0 1em;text-align:left}
#text h2{font-size:1.22em;line-height:1.3;margin:1.7em 0 .6em;font-weight:700;text-align:left}
#progressline{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:var(--line)}
#progressline i{display:block;height:100%;width:0;background:var(--accent)}
#pct{position:fixed;z-index:35;top:calc(8px + env(safe-area-inset-top));right:10px;font-size:.78rem;font-variant-numeric:tabular-nums;
padding:3px 9px;border-radius:999px;background:var(--bar);color:var(--fg);border:1px solid var(--line)}
#top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
padding:calc(8px + env(safe-area-inset-top)) 112px 8px 14px;
background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:transform .25s}
#title{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem;color:var(--muted)}
#bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);transition:transform .25s}
body.hide #top{transform:translateY(-110%)}
body.hide #bottom{transform:translateY(110%)}
body.nodoc #top,body.nodoc #bottom,body.nodoc #pct,body.nodoc #progressline{display:none}
#info{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
#seek{width:100%;margin:6px 0 10px;accent-color:var(--accent)}
#controls{display:flex;gap:8px;justify-content:space-between}
#controls .primary{flex:1;max-width:140px;font-size:1.1rem}
#controls button:not(.primary){flex:0 0 46px;width:46px;padding:0}
#welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#welcome.gone{display:none}
.card{width:100%;max-width:420px;text-align:center}
.card h1{margin:0 0 8px;font-size:1.6rem}
.card p{color:var(--muted);line-height:1.5}
.card .big{height:54px;padding:0 28px;font-size:1.05rem;margin:10px auto}
#werr{color:#d9534f!important}
#welcome.drag .card{outline:2px dashed var(--accent);outline-offset:18px}
#loading{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:14px}
#loading.on{display:flex}
#lbar{width:min(300px,70vw);height:8px;border-radius:8px;background:var(--line);overflow:hidden}
#lbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#ltext{color:var(--muted);font-size:.9rem}
#backdrop{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35);display:none}
#backdrop.on{display:block}
.sheet{position:fixed;z-index:45;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);
border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.row{margin:0 0 16px}
.row label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:42px;padding:0 6px;font-size:.85rem}
.seg button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw-light{background:#fafaf7;color:#1d1d1b}.sw-sepia{background:#f3e8d2;color:#3b2f20}
.sw-dark{background:#1c1d20;color:#d6d6d2}.sw-black{background:#000;color:#bdbdb8}
#toast{position:fixed;z-index:70;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:.95}
@media (min-width:700px){
  #bottom{left:0;right:0;margin:0 auto;width:min(680px,100%);padding:6px 16px calc(8px + env(safe-area-inset-bottom));
    border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
  #info{margin-bottom:0}
  #seek{margin:2px 0 6px}
  #controls button{height:36px}
  #controls button:not(.primary){flex:0 0 40px;width:40px}
  #controls .primary{max-width:96px;font-size:1rem}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body class="nodoc">

<div id="reader"><article id="text"></article></div>

<div id="progressline"><i></i></div>
<div id="pct">0.0%</div>
<header id="top"><span id="title"></span>
  <button id="bmBtn" class="ibtn" aria-label="Toggle bookmark"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></header>

<footer id="bottom">
  <div id="info"><span id="pageinfo"></span><span id="wpmlabel"></span><span id="left"></span></div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div id="controls">
    <button id="menuBtn" class="ibtn" aria-label="Contents, bookmarks, library"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="slower" aria-label="Slower">−</button>
    <button id="play" class="primary" aria-label="Play / pause">▶</button>
    <button id="faster" aria-label="Faster">+</button>
    <button id="settingsBtn" aria-label="Settings">Aa</button>
  </div>
</footer>

<div id="backdrop"></div>
<div id="sheet" class="sheet">
  <div class="row"><label><span>Text size</span><span id="v-size"></span></label><input type="range" id="r-size" min="13" max="36" step="1"></div>
  <div class="row"><label><span>Line spacing</span><span id="v-lh"></span></label><input type="range" id="r-lh" min="1.2" max="2.3" step="0.05"></div>
  <div class="row"><label><span>Side margins</span><span id="v-m"></span></label><input type="range" id="r-m" min="1" max="20" step="1"></div>
  <div class="row"><label><span>Top margin</span><span id="v-mt"></span></label><input type="range" id="r-mt" min="0" max="160" step="2"></div>
  <div class="row"><label><span>Bottom margin</span><span id="v-mb"></span></label><input type="range" id="r-mb" min="0" max="160" step="2"></div>
  <div class="row"><label><span>Top indicator (tap it to swap)</span></label>
    <div class="seg" id="seg-top"><button data-val="pct">Percentage</button><button data-val="page">Page number</button></div></div>
  <div class="row"><label><span>Progress, time left and slider cover</span></label>
    <div class="seg" id="seg-prog"><button data-val="book">Whole book</button><button data-val="chapter">Current chapter</button></div></div>
  <div class="row"><label><span>Footnotes</span></label>
    <div class="seg" id="seg-notes"><button data-val="inline">In the text</button><button data-val="hidden">Hidden</button></div></div>
  <div class="row"><label><span>Controls on desktop</span></label>
    <div class="seg" id="seg-bars"><button data-val="auto">Auto-hide</button><button data-val="show">Always show</button></div></div>
  <div class="row"><label><span>Page count (clear the box for the estimated pages)</span><span id="v-pages"></span></label>
    <div class="seg"><input type="number" class="numin" id="pagesInput" inputmode="numeric" min="1" max="5000" placeholder="e.g. 50"><button class="pgbtn2" id="pgDown" aria-label="Fewer pages">▼</button><button class="pgbtn2" id="pgUp" aria-label="More pages">▲</button></div></div>
  <div class="row"><label><span>Font</span><span id="v-font"></span></label>
    <select id="fontSel" class="numin" aria-label="Font"></select></div>
  <div class="row"><label><span>Alignment</span></label>
    <div class="seg" id="seg-align"><button data-val="left">Left</button><button data-val="justify">Justified</button></div></div>
  <div class="row"><label><span>Theme</span></label>
    <div class="seg" id="seg-theme">
      <button data-val="light" class="sw-light">Light</button><button data-val="sepia" class="sw-sepia">Sepia</button>
      <button data-val="dark" class="sw-dark">Dark</button><button data-val="black" class="sw-black">Black</button></div></div>
  <div class="row"><button id="trimBtn" style="width:100%">Remove chapters I've already read…</button></div>
  <div class="row"><button id="trimSpotBtn" style="width:100%">Remove everything before this spot…</button></div>
  <div class="row"><button id="sheetOpen" style="width:100%">Open another book</button></div>
  <div class="empty" style="text-align:center;padding:0 0 4px">EPUB Reader · version 9</div>
</div>

<div id="menu" class="sheet tall">
  <div class="tabs" id="tabs"><button data-tab="contents">Contents</button><button data-tab="marks">Bookmarks</button><button data-tab="library">Library</button></div>
  <div class="pbody" id="pb-contents"></div>
  <div class="pbody" id="pb-marks" hidden></div>
  <div class="pbody" id="pb-library" hidden>
    <div class="addrow"><button id="addPdf">+ Add a book</button></div>
    <div id="menuLib"></div>
    <div class="empty" id="storeInfo"></div>
  </div>
</div>

<div id="pager" class="sheet">
  <div class="pgrow">
    <button class="pgbtn" data-d="-10" aria-label="Back 10 pages">▼▼</button>
    <button class="pgbtn" data-d="-1" aria-label="Previous page">▼</button>
    <div id="pgNow">1 / 1</div>
    <button class="pgbtn" data-d="1" aria-label="Next page">▲</button>
    <button class="pgbtn" data-d="10" aria-label="Forward 10 pages">▲▲</button>
  </div>
  <input type="range" id="pgRange" min="1" max="1" step="1" value="1" aria-label="Page">
</div>

<div id="welcome">
  <div class="card">
    <h1>EPUB Reader</h1>
    <p>Open an EPUB to read with auto-scroll, bookmarks, a chapter list and a live progress percentage.</p>
    <button class="primary big" id="welcomeOpen">Open an EPUB</button>
    <div class="lib" id="welcomeLib"></div>
    <button id="installBtn" hidden>Install app</button>
    <p>Tip: once installed, share an EPUB to this app from your file manager.</p>
    <p id="werr"></p>
  </div>
</div>

<div id="loading"><div id="lbar"><i></i></div><div id="ltext">Loading…</div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/epub+zip,.epub" hidden>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const reader=$('#reader'), text=$('#text');

/* ---------- storage ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- settings ---------- */
const S=Object.assign({size:19,lh:1.65,m:6,mt:24,mb:16,top:'pct',prog:'book',notes:'inline',bars:'auto',font:'literata',align:'left',theme:'light',wpm:220},lsGet('epubr:settings',{}));
const FONT_LIST=[
  {id:'literata',label:'Literata',grp:'Serif',stack:"'Literata',Georgia,'Noto Serif',serif",gf:'Literata:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'sourceserif',label:'Source Serif',grp:'Serif',stack:"'Source Serif 4',Georgia,'Noto Serif',serif",gf:'Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'merriweather',label:'Merriweather',grp:'Serif',stack:"'Merriweather',Georgia,'Noto Serif',serif",gf:'Merriweather:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'lora',label:'Lora',grp:'Serif',stack:"'Lora',Georgia,'Noto Serif',serif",gf:'Lora:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'crimson',label:'Crimson Pro',grp:'Serif',stack:"'Crimson Pro',Georgia,'Noto Serif',serif",gf:'Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'garamond',label:'EB Garamond',grp:'Serif',stack:"'EB Garamond',Georgia,'Noto Serif',serif",gf:'EB+Garamond:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'atkinson',label:'Atkinson Hyperlegible',grp:'Sans',stack:"'Atkinson Hyperlegible',system-ui,Roboto,sans-serif",gf:'Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700'},
  {id:'lexend',label:'Lexend',grp:'Sans',stack:"'Lexend',system-ui,Roboto,sans-serif",gf:'Lexend:wght@400;700'},
  {id:'inter',label:'Inter',grp:'Sans',stack:"'Inter',system-ui,Roboto,sans-serif",gf:'Inter:wght@400;700'},
  {id:'jetbrains',label:'JetBrains Mono',grp:'Mono',stack:"'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace",gf:'JetBrains+Mono:wght@400;700'},
  {id:'syserif',label:'System serif',grp:'This device',stack:"Georgia,'Noto Serif',serif",gf:null},
  {id:'syssans',label:'System sans',grp:'This device',stack:"system-ui,Roboto,'Helvetica Neue',sans-serif",gf:null},
  {id:'sysmono',label:'System mono',grp:'This device',stack:"ui-monospace,Menlo,Consolas,monospace",gf:null}
];
const FONTS=Object.fromEntries(FONT_LIST.map(f=>[f.id,f]));
{const mig={serif:'literata',sans:'atkinson',mono:'jetbrains'};if(mig[S.font])S.font=mig[S.font];if(!FONTS[S.font])S.font='literata'}
const loadedFonts=new Set();
function ensureFont(id,after){
  const f=FONTS[id];
  if(!f||!f.gf||loadedFonts.has(id))return;
  loadedFonts.add(id);
  const l=document.createElement('link');
  l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+f.gf+'&display=swap';
  l.onload=()=>{
    try{document.fonts.load('1em '+f.stack.split(',')[0]).then(()=>{if(typeof after==='function')after()}).catch(()=>{})}catch(e){}
  };
  l.onerror=()=>{loadedFonts.delete(id);toast('Could not load '+f.label+' (offline?). Using a fallback font.')};
  document.head.appendChild(l);
}
(function(){
  const sel=document.getElementById('fontSel');let g='',og=null;
  for(const f of FONT_LIST){
    if(f.grp!==g){g=f.grp;og=document.createElement('optgroup');og.label=g;sel.appendChild(og)}
    const o=document.createElement('option');o.value=f.id;o.textContent=f.label;og.appendChild(o);
  }
})();
const THEME_COLORS={light:'#fafaf7',sepia:'#f3e8d2',dark:'#1c1d20',black:'#000000'};
function applySettings(){
  const r=document.documentElement;
  r.style.setProperty('--fs',S.size+'px');
  r.style.setProperty('--lh',S.lh);
  r.style.setProperty('--side',S.m+'vw');
  r.style.setProperty('--ff',(FONTS[S.font]||FONTS.literata).stack);
  ensureFont(S.font,()=>{if(typeof measure==='function'&&doc.paras.length){withAnchor(()=>{})}});
  $('#fontSel').value=S.font;$('#v-font').textContent=(FONTS[S.font]||FONTS.literata).gf?'downloads once, then works offline':'';
  r.style.setProperty('--align',S.align);
  r.dataset.theme=S.theme;
  $('#themeColor').content=THEME_COLORS[S.theme]||'#fafaf7';
  $('#r-size').value=S.size;$('#v-size').textContent=S.size+' px';
  $('#r-lh').value=S.lh;$('#v-lh').textContent=(+S.lh).toFixed(2);
  $('#r-m').value=S.m;$('#v-m').textContent=S.m;
  r.style.setProperty('--mt',S.mt+'px');r.style.setProperty('--mb',S.mb+'px');
  $('#r-mt').value=S.mt;$('#v-mt').textContent=S.mt+' px';
  $('#r-mb').value=S.mb;$('#v-mb').textContent=S.mb+' px';
  for(const [id,key] of [['seg-align','align'],['seg-theme','theme'],['seg-top','top'],['seg-prog','prog'],['seg-notes','notes'],['seg-bars','bars']])
    document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('sel',b.dataset.val===S[key]));
  $('#wpmlabel').textContent=S.wpm+' wpm';
  armBars();
}
function saveSettings(){lsSet('epubr:settings',S)}

/* ---------- EPUB loading ---------- */
const ZIP_URL='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const WORDS_PER_PAGE=250;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;
  s.onerror=()=>rej(new Error('Could not load the EPUB library. Check your internet connection.'));document.head.appendChild(s)})}
let zipReady=null;
function initZip(){

initZip().catch(()=>{});

const lname=e=>(e.localName||e.nodeName||'').replace(/^.*:/,'').toLowerCase();
function byLocal(root,name){const out=[];for(const e of root.getElementsByTagName('*'))if(lname(e)===name)out.push(e);return out}
const cleanTxt=s=>s.replace(/­/g,'').replace(/\s+/g,' ').trim();
function normPath(p){const o=[];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}return o.join('/')}
function splitHref(base,href){
  let parts=href.split('#'),p=parts[0],frag=parts[1]||'';
  p=p.split('?')[0];
  try{p=decodeURIComponent(p)}catch(e){}
  try{frag=decodeURIComponent(frag)}catch(e){}
  const dir=base.indexOf('/')>=0?base.slice(0,base.lastIndexOf('/')+1):'';
  return {path:p?normPath(p.charAt(0)==='/'?p.slice(1):dir+p):normPath(base),frag};
}
/* Chapter files you have cut text out of can start or end in the middle of a tag, contain stray
   control characters, or even be plain text. Tidy those cases before parsing. */
function repairMarkup(str){
  str=str.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  if(str.indexOf('<')<0){
    const esc=s=>s.replace(/&(?!#?\w+;)/g,'&amp;').replace(/>/g,'&gt;');
    return '<body>'+str.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map(s=>'<p>'+esc(s)+'</p>').join('')+'</body>';
  }
  const lt=str.indexOf('<'),gt=str.indexOf('>');
  if(gt>=0&&gt<lt)str=str.slice(gt+1);          // file begins in the middle of a tag
  return str.replace(/<[^<>]*$/,'');              // file ends in the middle of a tag
}
function parseMarkup(str){
  str=repairMarkup(str.replace(/^﻿/,''));
  let d=null;
  try{
    d=new DOMParser().parseFromString(str,'application/xhtml+xml');
    if(d.getElementsByTagName('parsererror').length||!d.body)d=null;
  }catch(e){d=null}
  if(!d)d=new DOMParser().parseFromString(str,'text/html');
  return d;
}
function parseXml(str){return new DOMParser().parseFromString(str.replace(/^﻿/,''),'application/xml')}

const BLOCKS=new Set(['p','div','section','article','blockquote','ul','ol','li','h1','h2','h3','h4','h5','h6','pre','table','thead','tbody','tfoot','tr','td','th','figure','figcaption','dl','dt','dd','header','footer','aside','main','hr','body','caption','address','details','summary','center','form','fieldset']);
const LEAF=new Set(['p','h1','h2','h3','h4','h5','h6','li','pre','dt','dd','figcaption','td','th','caption','summary']);
const SKIP_TAGS=new Set(['script','style','svg','img','image','nav','head','title','audio','video','iframe','object','canvas','noscript','select','button','input','textarea','map','rt','rp']);
function skipEl(el){
  if(SKIP_TAGS.has(lname(el)))return true;
  const t=(el.getAttribute('epub:type')||'')+' '+(el.getAttribute('role')||'');
  if(/pagebreak/.test(t))return true;
  if(el.hasAttribute('hidden'))return true;
  const st=el.getAttribute('style');
  return !!(st&&/display\s*:\s*none/i.test(st));
}
function hasBlock(el){for(const e of el.getElementsByTagName('*'))if(BLOCKS.has(lname(e)))return true;return false}

const supify=t=>t.replace(/[0-9]/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]);
function isNoteLink(c){
  if(lname(c)!=='a')return false;
  const href=c.getAttribute('href');
  if(!href||/^(https?:|mailto:|tel:)/i.test(href))return false;
  if(/noteref/.test((c.getAttribute('epub:type')||'')+' '+(c.getAttribute('role')||'')))return true;
  const t=cleanTxt(c.textContent);
  if(!t)return false;
  const inSup=!!(c.parentNode&&lname(c.parentNode)==='sup');
  return (t.length<=4&&(t.match(/\p{L}/gu)||[]).length<=1)||(inSup&&t.length<=6);
}
function extractChapter(str,path,paras,anchors,refs,src){
  const d=parseMarkup(str),body=d.body;
  if(!body)return;
  if(src)src.doc=d;
  const anchor=el=>{const id=el.getAttribute&&el.getAttribute('id');if(id)anchors.set(path+'#'+id,paras.length)};
  const push=(t,head,node)=>{if(t){if(src)src.nodes[paras.length]=node;paras.push({text:t,head:!!head&&t.length<200})}};
  /* text of one inline element; a footnote marker is kept (as a small marker) and remembered for linking */
  function elText(c){
    if(refs&&isNoteLink(c)){
      const mk=supify(cleanTxt(c.textContent));
      refs.push({para:paras.length,href:c.getAttribute('href'),marker:mk});
      return mk;
    }
    return inline(c);
  }
  function inline(node){
    let s='';
    for(const c of node.childNodes){
      if(c.nodeType===3){s+=c.nodeValue;continue}
      if(c.nodeType!==1)continue;
      anchor(c);
      if(lname(c)==='br'){s+=' ';continue}
      if(skipEl(c))continue;
      s+=elText(c);
    }
    return s;
  }
  function walk(el){
    let buf='',bufNode=null;
    const flush=()=>{const t=cleanTxt(buf);buf='';push(t,false,bufNode);bufNode=null};
    for(const c of el.childNodes){
      if(!bufNode&&(c.nodeType===3||c.nodeType===1))bufNode=c;
      if(c.nodeType===3){buf+=c.nodeValue;continue}
      if(c.nodeType!==1)continue;
      const n=lname(c);
      if(n==='br'){buf+=' ';continue}
      if(n==='hr'){flush();anchor(c);push('* * *',false,c);continue}
      if(BLOCKS.has(n)){
        flush();anchor(c);
        if(skipEl(c))continue;
        if(LEAF.has(n)&&!hasBlock(c))push(cleanTxt(inline(c)),/^h[1-6]$/.test(n),c);
        else walk(c);
      }else{
        anchor(c);
        if(skipEl(c))continue;
        buf+=elText(c);
      }
    }
    flush();
  }
  walk(body);
}

function imgRefs(str,base){
  const out=[];
  for(const m of str.matchAll(/(?:src|href)\s*=\s*["']([^"']+)["']/gi)){
    const h=m[1];if(/^(https?:|data:|mailto:)/i.test(h))continue;
    const p=splitHref(base,h).path;
    if(/\.(jpe?g|png|gif|svg|webp)$/i.test(p))out.push(p);
  }
  return out;
}

/* Fallback unzip: reads the zip index itself and ignores wrong size fields (some EPUBs have them) */
function indexZip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-22-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('bad zip');
  const count=dv.getUint16(e+10,true),cdOff=dv.getUint32(e+16,true);
  const dec=new TextDecoder('utf-8'),map=new Map();
  let p=cdOff;
  for(let k=0;k<count&&p+46<=u8.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    map.set(name.toLowerCase(),{name,method,csize,lo});
    p+=46+nl+el+cl;
  }
  if(!map.size)throw new Error('bad zip');
  return {map,cdOff};
}
async function inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const wr=ds.writable.getWriter();
  wr.write(bytes).catch(()=>{});wr.close().catch(()=>{});
  const rd=ds.readable.getReader(),chunks=[];let n=0;
  for(;;){const r=await rd.read();if(r.done)break;chunks.push(r.value);n+=r.value.length}
  const out=new Uint8Array(n);let o=0;
  for(const c of chunks){out.set(c,o);o+=c.length}
  return out;
}
async function tolerantRead(u8,idx,path){
  const ent=idx.map.get(path.toLowerCase());
  if(!ent)return null;
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  if(dv.getUint32(ent.lo,true)!==0x04034b50)return null;
  const start=ent.lo+30+dv.getUint16(ent.lo+26,true)+dv.getUint16(ent.lo+28,true);
  let data;
  if(ent.method===0)data=u8.subarray(start,start+ent.csize);
  else if(ent.method===8){
    try{data=await inflateRaw(u8.subarray(start,start+ent.csize))}
    catch(e){
      // the stored compressed size may be wrong too: give it everything up to the next entry
      let next=idx.cdOff;
      for(const o of idx.map.values())if(o.lo>ent.lo&&o.lo<next)next=o.lo;
      data=await inflateRaw(u8.subarray(start,next));
    }
  }else return null;
  return new TextDecoder('utf-8').decode(data);
}

async function readEpub(file,progress){
  const report=(f,m)=>{if(typeof progress==='function')progress(f,m)};
  await initZip();
  const ab=await file.arrayBuffer(),u8=new Uint8Array(ab);
  let zip=null;
  try{zip=await JSZip.loadAsync(ab)}catch(e){zip=null}
  let rawIdx=null;
  const raw=()=>rawIdx||(rawIdx=indexZip(u8));
  if(!zip){try{raw()}catch(e){throw new Error('This file does not look like a valid EPUB.')}}
  const ci={};
  if(zip)zip.forEach((p,e)=>{if(!e.dir)ci[p.toLowerCase()]=e});
  const concat=(chunks,n)=>{const o=new Uint8Array(n);let k=0;for(const c of chunks){o.set(c,k);k+=c.length}return o};
  const streamRead=entry=>new Promise(resolve=>{
    const chunks=[];let n=0;
    try{
      entry.internalStream('uint8array')
        .on('data',c=>{chunks.push(c);n+=c.length})
        .on('error',()=>resolve(n?concat(chunks,n):null))
        .on('end',()=>resolve(concat(chunks,n)))

    }catch(err){resolve(null)}
  });
  const findEntry=p=>zip?(zip.file(p)||ci[p.toLowerCase()]||null):null;
  const hasEntry=p=>{
    if(findEntry(p))return true;
    try{return raw().map.has(p.toLowerCase())}catch(err){return false}
  };
  const readText=async p=>{
    const e=findEntry(p);
    if(e){
      try{return await e.async('string')}catch(err){}
      const d=await streamRead(e);              // wrong size field: keep the data that did decode
      if(d)return new TextDecoder('utf-8').decode(d);
    }
    try{const t=await tolerantRead(u8,raw(),p);if(t!=null)return t}catch(err){}
    return null;
  };

  const enc=await readText('META-INF/encryption.xml');
  if(enc){
    const algs=[...enc.matchAll(/<(?:\w+:)?EncryptionMethod[^>]*Algorithm="([^"]+)"/g)].map(m=>m[1]);
    if(algs.some(a=>!/idpf\.org\/2008\/embedding|ns\.adobe\.com\/pdf\/enc#RC/.test(a)))
      throw new Error('This EPUB is protected by DRM, so it can\'t be opened here.');
  }
  const cont=await readText('META-INF/container.xml');
  if(!cont)throw new Error('This file does not look like a valid EPUB (no container.xml).');
  const rf=byLocal(parseXml(cont),'rootfile')[0];
  const opfPath=rf&&rf.getAttribute('full-path');
  const opfStr=opfPath&&await readText(opfPath);
  if(!opfStr)throw new Error('This EPUB is missing its package file.');
  const opf=parseXml(opfStr);

  const manifest=new Map();
  for(const it of byLocal(opf,'item'))manifest.set(it.getAttribute('id'),{href:it.getAttribute('href')||'',type:it.getAttribute('media-type')||'',props:it.getAttribute('properties')||''});
  const spineEl=byLocal(opf,'spine')[0];
  const spineIds=byLocal(opf,'itemref').filter(r=>r.getAttribute('linear')!=='no').map(r=>r.getAttribute('idref'));
  if(!spineIds.length)throw new Error('This EPUB has no readable content.');
  const meta=n=>{const e=byLocal(opf,n)[0];return e?cleanTxt(e.textContent):''};
  let title=meta('title')||file.name.replace(/\.epub$/i,'');
  const author=meta('creator');
  const lang=(meta('language')||'en').split(/[,;\s]/)[0]||'en';

  const paras=[],anchors=new Map(),docStart=new Map(),docs=[],spineDocs=[],noteRefs=[];
  let missing=0,unreadable=0;
  for(let i=0;i<spineIds.length;i++){
    const it=manifest.get(spineIds[i]);
    if(it){
      const path=splitHref(opfPath,it.href).path;
      const str=await readText(path);
      if(str!=null){
        docStart.set(path,paras.length);
        const before=paras.length;
        const nr0=noteRefs.length;
        try{extractChapter(str,path,paras,anchors,noteRefs)}catch(e){unreadable++}
        for(let q=nr0;q<noteRefs.length;q++)noteRefs[q].path=path;
        if(paras.length>before)docs.push({path,s:i,start:before,count:paras.length-before});
        spineDocs.push({s:i,path,refs:imgRefs(str,path)});
      }else if(hasEntry(path))unreadable++;
      else missing++;
    }
    if(i%3===0||i===spineIds.length-1){report((i+1)/spineIds.length,'Reading chapters… '+(i+1)+' / '+spineIds.length);await tick()}
  }
  /* Footnotes: a short marker link (*, 1, [2], …) whose target sits in another file is a footnote.
     The note text is placed right after the paragraph that cites it, and removed from where the book keeps it. */
  {
    const hide=(typeof S!=='undefined'&&S.notes==='hidden');

      const h=splitHref(r.path,r.href);
      if(h.path===r.path)return null;
      let t=h.frag?anchors.get(h.path+'#'+h.frag):docStart.get(h.path);
      return t==null||t>=paras.length||paras[t].head||paras[t].text.length>2500?null:t;
    };
    const pairs=new Set();
    for(const r of noteRefs){const t=target(r);if(t!=null)pairs.add(Math.min(r.para,paras.length-1)+'>'+t)}
    for(const r of noteRefs){
      const t=target(r);
      if(t==null||consumed.has(t))continue;
      const at=Math.min(r.para,paras.length-1);
      if(at<0||at===t)continue;
      if(at>t&&pairs.has(t+'>'+at))continue;           // that is the note's "back to the text" link, not a citation
      consumed.add(t);
      if(!hide){if(!after.has(at))after.set(at,[]);after.get(at).push(t)}
    }
    /* a note whose citing text has been deleted from the file is dropped too (it starts with a link back to missing text) */
    for(const r of noteRefs){
      const h=splitHref(r.path,r.href),p=paras[r.para];
      if(h.path===r.path||!p||p.head||consumed.has(r.para)||!p.text.startsWith(r.marker)||p.text.length>=2500)continue;
      if(!docStart.has(h.path)||(h.frag&&!anchors.has(h.path+'#'+h.frag)))consumed.add(r.para);
    }
    if(consumed.size){
      const np=[],remap=new Array(paras.length).fill(-1),ins=new Map();
      paras.forEach((p,i)=>{
        if(consumed.has(i))return;
        remap[i]=np.length;np.push(p);
        for(const t of after.get(i)||[]){np.push({text:paras[t].text,head:false,note:true});ins.set(i,(ins.get(i)||0)+1)}
      });
      const fwd=v=>{while(v<paras.length&&remap[v]<0)v++;return v<paras.length?remap[v]:np.length-1};
      for(const [k,v] of anchors)anchors.set(k,fwd(v));
      for(const [k,v] of docStart)docStart.set(k,fwd(v));
      const old=docs.slice();docs.length=0;
      for(const d of old){
        const bases=[];
        for(let i=d.start;i<d.start+d.count;i++)if(remap[i]>=0)bases.push(remap[i]);
        if(!bases.length)continue;
        const last=bases[bases.length-1],lastOld=d.start+d.count-1;
        let tailNotes=0;for(let i=d.start;i<d.start+d.count;i++)if(remap[i]===last)tailNotes=ins.get(i)||0;
        docs.push({path:d.path,s:d.s,start:bases[0],count:last+tailNotes-bases[0]+1,bases});
      }
      paras.length=0;np.forEach(x=>paras.push(x));
    }else for(const d of docs){d.bases=[];for(let i=0;i<d.count;i++)d.bases.push(d.start+i)}
    for(const d of docs)d.bases.forEach((gi,k)=>{paras[gi].k=k;let j=gi+1;while(paras[j]&&paras[j].note){paras[j].k=k;j++}});
  }
  let words=0;
  for(const p of paras)words+=p.text.split(/\s+/).length;
  if(words<20)throw new Error('No readable text found in this EPUB (it may be image-based or protected).');

  /* contents: EPUB 3 nav, else EPUB 2 NCX, else detected headings */
  const toc=[];
  const addToc=(label,href,depth,base)=>{
    const h=splitHref(base,href);
    let idx=h.frag&&anchors.has(h.path+'#'+h.frag)?anchors.get(h.path+'#'+h.frag):docStart.get(h.path);
    if(idx==null)return;
    idx=Math.min(idx,paras.length-1);
    const t=cleanTxt(label);
    if(t)toc.push({title:t,depth:Math.min(depth,3),idx});
  };
  try{
    let navItem=null,ncxItem=null;
    for(const it of manifest.values()){
      if(/(^|\s)nav(\s|$)/.test(it.props))navItem=navItem||it;
      if(/dtbncx/.test(it.type))ncxItem=ncxItem||it;
    }
    if(!ncxItem&&spineEl&&spineEl.getAttribute('toc'))ncxItem=manifest.get(spineEl.getAttribute('toc'))||null;
    if(navItem){
      const base=splitHref(opfPath,navItem.href).path;
      const str=await readText(base);
      if(str){
        const nd=parseMarkup(str);
        const navs=nd.getElementsByTagName('nav');
        let nav=null;
        for(const n of navs){if(/toc/.test(n.getAttribute('epub:type')||'')){nav=n;break}}
        if(!nav&&navs.length)nav=navs[0];
        const walkList=(list,depth)=>{
          for(const li of list.children){
            if(lname(li)!=='li')continue;
            let a=null,sub=null;
            for(const c of li.children){
              const n=lname(c);
              if(!a&&(n==='a'||n==='span'))a=c;
              else if(n==='ol'||n==='ul')sub=c;
            }
            if(a&&a.getAttribute('href'))addToc(a.textContent,a.getAttribute('href'),depth,base);
            if(sub)walkList(sub,depth+1);
          }
        };
        if(nav){const lists=[...nav.children].filter(c=>/^(ol|ul)$/.test(lname(c)));lists.forEach(l=>walkList(l,0))}
      }
    }
    if(toc.length<2&&ncxItem){
      toc.length=0;
      const base=splitHref(opfPath,ncxItem.href).path;
      const str=await readText(base);
      if(str){
        const nm=byLocal(parseXml(str),'navmap')[0];
        const walkNcx=(el,depth)=>{
          for(const np of el.children){
            if(lname(np)!=='navpoint')continue;
            let src='',label='';
            for(const c of np.children){
              const n=lname(c);

    }
  }catch(e){}
  if(toc.length<2){
    toc.length=0;
    paras.forEach((p,i)=>{if(p.head)toc.push({title:p.text,depth:0,idx:i})});
  }

  /* estimated pages, by word count */
  let w=0;
  for(const p of paras){p.page=Math.floor(w/WORDS_PER_PAGE)+1;w+=p.text.split(/\s+/).length}
  const numPages=Math.max(1,Math.ceil(words/WORDS_PER_PAGE));
  const bits=[];
  /* Missing chapters are normal here (read chapters get deleted on purpose), and one or two
     unreadable files (footnotes etc.) are not worth a warning. Only flag a clearly damaged file. */
  if(unreadable>=3)bits.push(unreadable+' sections could not be read');
  /* a stable identity, so a copy with chapters removed is still recognised as the same book */
  const ident=meta('identifier');

  const cssPaths=[...manifest.values()].filter(m=>/css/.test(m.type)).map(m=>splitHref(opfPath,m.href).path);
  return {paras,title,author,lang,toc,numPages,docs,bid,spineDocs,cssPaths,readText,warning:bits.join('. ')};
}

/* Older versions identified a book by file name + size, which changes whenever chapters are
   deleted. Carry that saved data (place, bookmarks, page count) over to the stable id. */
function migrateLegacyKeys(oldId,newId,name){
  const olds=[oldId].concat(library.filter(e=>!/^b:/.test(e.id)&&e.name===name).map(e=>e.id));
  try{
    for(const o of olds)for(const k of ['pos','pages','bm']){
      const ok='epubr:'+k+':'+o,nk='epubr:'+k+':'+newId;
      if(localStorage.getItem(ok)!=null&&localStorage.getItem(nk)==null)localStorage.setItem(nk,localStorage.getItem(ok));
    }
  }catch(e){}
}

  showLoading('Opening book…',0);
  try{
    const r=await readEpub(file,(f,m)=>setLoading(f,m));
    const {paras,title,author,lang,numPages}=r;
    doc={paras,numPages,title,author};
    docs=r.docs;curBook=Object.assign(r,{file});
    bookId=r.bid;legacyId=file.name+'|'+file.size;
    migrateLegacyKeys(legacyId,bookId,file.name);
    docKey='epubr:pos:'+bookId;
    bookmarks=lsGet('epubr:bm:'+bookId,[]);
    toc=r.toc;
    pagesKey='epubr:pages:'+bookId;
    customPages=lsGet(pagesKey,0);
    text.lang=lang;
    render();buildChapters();
    $('#title').textContent=title;
    syncPagesUI();
    document.title=title+' · EPUB Reader';
    $('#welcome').classList.add('gone');
    document.body.classList.remove('nodoc','hide');
    hideLoading();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    measure();
    /* bookmarks saved by older versions used a global word offset; pin them to their chapter now */
    let conv=false;
    for(const b of bookmarks){
      if(!b.d&&typeof b.w==='number'){
        const i=paraAtWord(b.w),an=anchorAt(i,Math.min(1,Math.max(0,(b.w-cum[i])/Math.max(1,wc[i]))));
        if(an){Object.assign(b,an);delete b.w;conv=true}
      }
    }
    if(conv)saveMarks();
    const rec=lsGet(docKey,0);
    let resumed=false;
    if(rec&&typeof rec==='object'){
      const a=resolveAnchor(rec,true);
      if(a){scrollToAnchor(a);resumed=true}
    }else if(rec>0.002){
      reader.scrollTop=rec*maxScroll();pos=reader.scrollTop;resumed=true;
    }
    if(resumed)toast('Resumed at '+(Math.min(1,reader.scrollTop/maxScroll())*100).toFixed(1)+'%');
    else{reader.scrollTop=0;pos=0}
    updateUI();
    armBars();
    if(r.warning)setTimeout(()=>toast(r.warning,7000),2600);
    libRegister(file,r.bid,legacyId,title,author,numPages,!(opts&&opts.skipSave));
  }catch(err){
    hideLoading();
    const msg=err&&err.message?err.message:String(err);
    if($('#welcome').classList.contains('gone'))toast(msg);else $('#werr').textContent=msg;
    if(!$('#welcome').classList.contains('gone')||doc.paras.length===0)$('#werr').textContent=msg;
    else alert(msg);
  }
}

function render(){
  const frag=document.createDocumentFragment();
  totalWords=0;cum=[];wc=[];
  for(const p of doc.paras){
    const el=document.createElement(p.head?'h2':'p');
    if(p.note)el.className='fn';
    el.textContent=p.text;frag.appendChild(el);
    const n=p.text.split(/\s+/).length;
    cum.push(totalWords);wc.push(n);totalWords+=n;
  }
  text.replaceChildren(frag);
}

function measure(){
  const ch=text.children;
  tops=new Array(ch.length);
  for(let i=0;i<ch.length;i++)tops[i]=ch[i].offsetTop;
  if(ch.length){const last=ch[ch.length-1];spanH=Math.max(1,last.offsetTop+last.offsetHeight-ch[0].offsetTop);endScroll=Math.max(1,last.offsetTop+last.offsetHeight-40)}
}
function maxScroll(){return Math.max(1,Math.min(reader.scrollHeight-reader.clientHeight,endScroll))}
function curIndex(){
  if(!tops.length)return 0;
  const y=reader.scrollTop+40;
  let lo=0,hi=tops.length-1;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(tops[mid]<=y)lo=mid;else hi=mid-1}
  return lo;
}

/* ---------- page numbering (estimated from word count, or a custom page count) ---------- */
function pageCount(){return customPages>0?customPages:doc.numPages}
function wordPos(){
  const i=curIndex(),el=text.children[i];
  if(!el)return 0;
  const y=reader.scrollTop+40,h=Math.max(1,el.offsetHeight);
  const fr=Math.min(1,Math.max(0,(y-tops[i])/h));
  return cum[i]+fr*wc[i];
}
/* Places in the book are remembered as "chapter file + paragraph inside it", not as a global
   offset, so deleting other chapters (or trimming text elsewhere) never moves them. */
function docOfPara(i){
  if(!docs.length)return null;
  let lo=0,hi=docs.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(docs[m].start<=i)lo=m;else hi=m-1}
  return docs[lo];
}
function anchorAt(i,fr){const d=docOfPara(i);return d?{d:d.path,s:d.s,i:doc.paras[i].k,fr:doc.paras[i].note?0:fr}:null}
function resolveAnchor(a,nearest){          // -> {i,fr} in the current file, or null
  if(!a||!a.d)return null;
  const d=docs.find(x=>x.path===a.d);
  if(d){const over=a.i>=d.bases.length;return {i:d.bases[Math.min(a.i,d.bases.length-1)],fr:over?0:(a.fr||0)}}
  if(nearest){const n=docs.find(x=>x.s>=a.s);if(n)return {i:n.start,fr:0}}
  return null;
}
function frInPara(){
  const i=curIndex(),el=text.children[i];
  if(!el)return 0;
  return Math.min(1,Math.max(0,(reader.scrollTop+40-tops[i])/Math.max(1,el.offsetHeight)));
}
function scrollToAnchor(r){
  const el=text.children[r.i];if(!el)return;
  reader.scrollTop=Math.max(0,tops[r.i]+r.fr*el.offsetHeight-40);pos=reader.scrollTop;lastSet=pos;
}
function posRecord(f){
  const a=anchorAt(curIndex(),frInPara());
  return a?Object.assign(a,{f}):f;
}
const posFrac=r=>typeof r==='number'?r:(r&&r.f)||0;
function bmWord(b){
  if(b.d){const r=resolveAnchor(b,false);return r?cum[r.i]+r.fr*wc[r.i]:null}
  return typeof b.w==='number'?b.w:null;
}
/* chapters: every contents entry down to the deepest level whose sections are still chapter-sized
   (so "Book II" and "Chapter Five" both start a new chapter); tiny parts like a "Book II" title page join the chapter after them */
function buildChapters(){
  chapters=[];
  if(!toc.length||!doc.paras.length)return;
  const N=doc.paras.length,wordsOf=(a,b)=>(b>=N?totalWords:cum[b])-cum[a];
  const sorted=toc.slice().sort((a,b)=>a.idx-b.idx||a.depth-b.depth);
  const level=d=>{const seen=new Set();return sorted.filter(t=>t.depth<=d&&!seen.has(t.idx)&&seen.add(t.idx))};
  const maxD=Math.max(...toc.map(t=>t.depth));
  let L=0;
  for(let d=1;d<=maxD;d++){if(totalWords/level(d).length>=300)L=d;else break}
  const list=level(L);
  if(!list.length)return;
  if(list[0].idx>0)list.unshift({title:doc.title,idx:0});
  const raw=list.map((t,k)=>({start:t.idx,end:k+1<list.length?list[k+1].idx:N,title:t.title}));
  let carry=null;
  raw.forEach((c,k)=>{
    if(carry){c.title=carry.title+' · '+c.title;c.start=carry.start;carry=null}
    if(k<raw.length-1&&wordsOf(c.start,c.end)<60){carry=c;return}
    chapters.push(c);
  });
}
function chapterAt(i){let k=0;for(let j=0;j<chapters.length;j++){if(chapters[j].start<=i)k=j;else break}return chapters[k]}
function chapterRange(c){
  const max=Math.max(1,maxScroll());
  const a=Math.min(max-1,Math.max(0,(tops[c.start]||0)-40));
  const b=c.end<doc.paras.length?Math.min(max,Math.max(a+1,(tops[c.end]||0)-40)):max;
  return {a,b:Math.max(a+1,b)};
}
function pageNow(){
  const N=pageCount(),max=maxScroll();
  if(max>0&&reader.scrollTop>=max-2)return N;
  return Math.min(N,Math.max(1,Math.floor(wordPos()/Math.max(1,totalWords)*N+1e-6)+1));
}
function paraAtWord(w){
  let lo=0,hi=cum.length-1;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(cum[mid]<=w)lo=mid;else hi=mid-1}
  return lo;
}
function jumpToPara(i){
  reader.scrollTop=Math.max(0,(tops[i]||0)-40);pos=reader.scrollTop;lastSet=pos;updateUI();
}
function scrollToWord(w){
  const i=paraAtWord(w),el=text.children[i];
  if(!el)return;
  const top=tops[i]+((w-cum[i])/Math.max(1,wc[i]))*el.offsetHeight-40;
  reader.scrollTop=Math.max(0,top);pos=reader.scrollTop;lastSet=pos;updateUI();
}
function pageOfWord(w){
  const N=pageCount();
  return Math.min(N,Math.max(1,Math.floor(w/Math.max(1,totalWords)*N+1e-6)+1));
}
function gotoPage(n,dir){
  const N=pageCount();n=Math.max(1,Math.min(N,Math.round(n)));
  if(n===1){reader.scrollTop=0;pos=0;lastSet=0;updateUI();return}
  scrollToWord((n-1)/N*totalWords+0.02*totalWords/N);
}
function labelPages(){
  $('#v-pages').textContent=customPages>0?customPages+' (estimated: '+doc.numPages+')':'Estimated pages ('+(doc.numPages||'–')+')';
}
function syncPagesUI(){
  const inp=$('#pagesInput');
  inp.value=customPages>0?customPages:'';
  inp.placeholder=doc.numPages?'Est: '+doc.numPages:'e.g. 50';
  labelPages();
}
function setCustomPages(v){
  customPages=v>0?Math.min(5000,v):0;
  if(pagesKey)lsSet(pagesKey,customPages);
  labelPages();updateUI();
}
$('#pagesInput').addEventListener('input',e=>{const v=parseInt(e.target.value,10);setCustomPages(isNaN(v)?0:v)});
function nudgePages(d){
  const base=customPages>0?customPages:(doc.numPages||1);
  const v=Math.max(1,Math.min(5000,base+d));
  $('#pagesInput').value=v;setCustomPages(v);
}
function bindNudge(btn,d){
  let t1=0,t2=0,n=0;
  const halt=()=>{clearTimeout(t1);clearTimeout(t2);n=0};
  const loop=()=>{nudgePages(d*(n>20?10:1));n++;t2=setTimeout(loop,n>20?70:110)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();halt();nudgePages(d);t1=setTimeout(loop,420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,halt));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}

$('#pageinfo').addEventListener('click',()=>{if(doc.paras.length)openPanel('#pager')});

/* ---------- progress UI ---------- */
function fmtTime(m){
  if(m<1)return '<1 min left';
  if(m<60)return Math.round(m)+' min left';
  const h=Math.floor(m/60),r=Math.round(m%60);
  return h+' h '+r+' min left';
}
let saveT=0;
function updateUI(){
  if(!doc.paras.length)return;
  const max=Math.max(1,maxScroll());
  const f=Math.min(1,Math.max(0,reader.scrollTop/max));
  let fp=f,leftWords=totalWords*(1-f),chap=null;
  if(S.prog==='chapter'&&chapters.length){
    chap=chapterAt(curIndex());
    const {a,b}=chapterRange(chap);
    fp=Math.min(1,Math.max(0,(reader.scrollTop-a)/Math.max(1,b-a)));
    const words=(chap.end>=doc.paras.length?totalWords:cum[chap.end])-cum[chap.start];
    leftWords=Math.max(0,words)*(1-fp);
  }
  const tt=chap?chap.title:doc.title;
  if($('#title').textContent!==tt)$('#title').textContent=tt;
  const pctTxt=(fp*100).toFixed(1)+'%',pgTxt='p. '+pageNow()+' / '+pageCount();
  $('#progressline i').style.width=(fp*100)+'%';
  if(!dragging)$('#seek').value=Math.round(fp*1000);
  const showPage=S.top==='page';
  $('#pct').textContent=showPage?pgTxt:pctTxt;
  $('#pageinfo').textContent=showPage?pctTxt:pgTxt;
  $('#bmBtn').classList.toggle('on',bookmarksInView().length>0);
  updatePager();
  $('#left').textContent=fmtTime(leftWords/S.wpm)+(chap?' · chapter':'');
  clearTimeout(saveT);
  saveT=setTimeout(()=>lsSet(docKey,posRecord(f)),400);
}
let uiQueued=false;
reader.addEventListener('scroll',()=>{
  if(uiQueued)return;uiQueued=true;
  requestAnimationFrame(()=>{uiQueued=false;updateUI()});
},{passive:true});

/* ---------- auto-scroll ---------- */
function pxPerSec(){return (S.wpm/60)*(spanH/Math.max(1,totalWords))}
function frame(t){
  if(!playing)return;
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  if(touching){pos=reader.scrollTop}
  else{
    if(Math.abs(reader.scrollTop-lastSet)>2)pos=reader.scrollTop;
    pos+=pxPerSec()*dt;
    const max=maxScroll();
    if(pos>=max){reader.scrollTop=max;stop();toast('End of document');return}
    reader.scrollTop=pos;lastSet=reader.scrollTop;
  }
  raf=requestAnimationFrame(frame);
}
async function lockScreen(){
  try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}
}
function unlockScreen(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function start(){
  if(playing||!doc.paras.length)return;
  playing=true;pos=reader.scrollTop;lastSet=pos;lastT=performance.now();
  $('#play').textContent='⏸';
  document.body.classList.add('hide');
  lockScreen();
  raf=requestAnimationFrame(frame);
}
function stop(){
  if(!playing)return;
  playing=false;cancelAnimationFrame(raf);
  $('#play').textContent='▶';
  unlockScreen();
}
function toggle(){playing?stop():start()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing)lockScreen()});
reader.addEventListener('touchstart',()=>{touching=true},{passive:true});
reader.addEventListener('touchend',()=>{touching=false},{passive:true});

function wpmStep(dir){const step=Math.max(10,Math.round(S.wpm*0.08/5)*5);setWpm(S.wpm+dir*step)}

/* desktop: controls fade away while you read with the mouse, and come back when you move it */

/* ---------- library: several books kept on this device ---------- */
const LIB='epub-lib';
const libUrl=n=>new URL(n,new URL('./',location.href)).href;
const bookKey=id=>libUrl('book/'+encodeURIComponent(id));
let library=lsGet('epubr:lib',[]);
function saveLib(){lsSet('epubr:lib',library)}
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function putBlob(url,file){
  const c=await caches.open(LIB);
  await c.put(url,new Response(file,{headers:{'Content-Type':'application/epub+zip','X-Filename':encodeURIComponent(file.name),'X-Size':String(file.size)}}));
}
async function takeFile(url){
  try{
    const r=await (await caches.open(LIB)).match(url);
    if(!r)return null;
    const b=await r.blob();
    return new File([b],decodeURIComponent(r.headers.get('X-Filename')||'book.epub'),{type:'application/epub+zip'});
  }catch(e){return null}
}
async function libRegister(file,id,oldId,title,author,pages,storeBlob){
  /* drop entries from older versions that are this same book (same file name or same old id) */
  for(const old of library.filter(b=>b.id!==id&&!/^b:/.test(b.id)&&(b.id===oldId||b.name===file.name))){
    try{await (await caches.open(LIB)).delete(bookKey(old.id))}catch(err){}
    try{['pos','pages','bm'].forEach(k=>localStorage.removeItem('epubr:'+k+':'+old.id))}catch(err){}
    library=library.filter(b=>b!==old);
  }
  let e=library.find(b=>b.id===id);
  if(!e){e={id,name:file.name,size:file.size};library.push(e)}
  e.name=file.name;e.size=file.size;
  e.title=title;e.author=author||'';e.pages=pages;e.last=Date.now();
  /* a re-opened copy (e.g. with read chapters deleted) replaces the stored one; opening from the library itself does not */
  if(storeBlob){
    try{await putBlob(bookKey(id),file);e.stored=true}
    catch(err){e.stored=false;toast('Could not keep this book offline (storage full?)')}
  }
  saveLib();renderPanels();
}
async function openBook(id){
  const f=await takeFile(bookKey(id));
  if(f)openFile(f,{skipSave:true});
  else{
    const e=library.find(b=>b.id===id);
    if(e){e.stored=false;saveLib()}
    renderPanels();toast('That book is no longer stored on this device');
  }
}
async function deleteBook(id){
  const e=library.find(b=>b.id===id);
  if(!e||!confirm('Remove "'+(e.title||e.name)+'" from this device?'))return;
  try{await (await caches.open(LIB)).delete(bookKey(id))}catch(err){}
  library=library.filter(b=>b.id!==id);saveLib();
  try{['pos','pages','bm'].forEach(k=>localStorage.removeItem('epubr:'+k+':'+id))}catch(err){}
  renderPanels();
}
function renderLibrary(box){
  box.replaceChildren();
  const list=library.filter(b=>b.stored!==false).sort((a,b)=>(b.last||0)-(a.last||0));
  if(!list.length){box.appendChild(mk('div','empty','No saved books yet. Open an EPUB and it will be kept here for next time.'));return}
  for(const b of list){
    const frac=posFrac(lsGet('epubr:pos:'+b.id,0));
    const row=mk('div','item'+(b.id===bookId?' cur':''));
    const g=mk('div','grow');
    g.append(mk('div','t',b.title||b.name),
      mk('div','m',(b.author?b.author+' · ':'')+(frac>0.002?Math.round(frac*100)+'% read':'Not started')+' · '+(b.pages?'~'+b.pages+' pp · ':'')+fmtSize(b.size)));
    const x=mk('button','x','✕');x.setAttribute('aria-label','Remove from this device');
    x.onclick=ev=>{ev.stopPropagation();deleteBook(b.id)};
    row.append(g,x);
    row.onclick=()=>{if(b.id===bookId&&doc.paras.length)closePanels();else openBook(b.id)};
    box.appendChild(row);
  }
}
async function storeInfo(){
  const d=$('#storeInfo');
  try{
    const e=await navigator.storage.estimate();
    d.textContent='Storage used by this app: '+fmtSize(e.usage||0)+(e.quota?' of '+fmtSize(e.quota)+' available':'');
  }catch(err){d.textContent=''}
}

/* re-read the open book (used when a setting changes how the text is built), keeping the place */
function reloadBook(){
  if(!curBook||!doc.paras.length)return;
  clearTimeout(saveT);lsSet(docKey,posRecord(Math.min(1,reader.scrollTop/maxScroll())));
  closePanels();openFile(curBook.file,{skipSave:true});
}

/* ---------- remove chapters already read: copies the zip, leaving out the earlier chapter files ---------- */
function zipDir(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-22-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('bad zip');
  const count=dv.getUint16(e+10,true),cdOff=dv.getUint32(e+16,true);
  if(count===0xFFFF||cdOff===0xFFFFFFFF)throw new Error('This file is too large to trim here.');
  const dec=new TextDecoder('utf-8'),ents=[];
  let p=cdOff;
  for(let k=0;k<count&&p+46<=u8.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    ents.push({name:dec.decode(u8.subarray(p+46,p+46+nl)),lo:dv.getUint32(p+42,true),rec:u8.subarray(p,p+46+nl+el+cl)});
    p+=46+nl+el+cl;
  }
  if(!ents.length)throw new Error('bad zip');
  return {ents,cdOff};
}
let crcT=null;
function crc32(u8){
  if(!crcT){crcT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[n]=c>>>0}}
  let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcT[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream==='undefined')return null;
  try{
    const cs=new CompressionStream('deflate-raw');
    const wr=cs.writable.getWriter();wr.write(bytes).catch(()=>{});wr.close().catch(()=>{});
    const rd=cs.readable.getReader(),chunks=[];let n=0;
    for(;;){const r=await rd.read();if(r.done)break;chunks.push(r.value);n+=r.value.length}
    const o=new Uint8Array(n);let k=0;for(const c of chunks){o.set(c,k);k+=c.length}
    return o;
  }catch(e){return null}
}
/* a zip entry holding new content (compressed when the browser can, otherwise stored) */
async function buildEntry(e,bytes){
  const def=await deflateRaw(bytes);
  const data=def&&def.length<bytes.length?def:bytes,method=data===bytes?0:8;
  const rec=e.rec.slice(),rdv=new DataView(rec.buffer,rec.byteOffset,rec.byteLength);
  const nl=rdv.getUint16(28,true),nameBytes=rec.slice(46,46+nl);
  const flags=rdv.getUint16(8,true)&~8;
  const crc=crc32(bytes);
  rdv.setUint16(6,20,true);rdv.setUint16(8,flags,true);rdv.setUint16(10,method,true);
  rdv.setUint32(16,crc,true);rdv.setUint32(20,data.length,true);rdv.setUint32(24,bytes.length,true);
  const local=new Uint8Array(30+nl+data.length),ldv=new DataView(local.buffer);
  ldv.setUint32(0,0x04034b50,true);ldv.setUint16(4,20,true);ldv.setUint16(6,flags,true);ldv.setUint16(8,method,true);
  ldv.setUint16(10,rdv.getUint16(12,true),true);ldv.setUint16(12,rdv.getUint16(14,true),true);
  ldv.setUint32(14,crc,true);ldv.setUint32(18,data.length,true);ldv.setUint32(22,bytes.length,true);
  ldv.setUint16(26,nl,true);ldv.setUint16(28,0,true);
  local.set(nameBytes,30);local.set(data,30+nl);
  return {local,rec};
}
/* Raw copy of the kept entries: nothing is decompressed or re-encoded, so odd size fields survive as they were.
   `replace` maps an entry name (lower case) to new content for that one entry. */
async function trimZip(u8,drop,replace){
  const {ents,cdOff}=zipDir(u8);
  const order=ents.slice().sort((a,b)=>a.lo-b.lo);
  order.forEach((e,i)=>{e.end=i+1<order.length?order[i+1].lo:cdOff});
  const keep=order.filter(e=>!drop.has(e.name.toLowerCase()));
  const built=new Map();
  if(replace)for(const e of keep){const r=replace.get(e.name.toLowerCase());if(r)built.set(e,await buildEntry(e,r))}
  let size=22;
  for(const e of keep){const b=built.get(e);size+=b?b.local.length+b.rec.length:(e.end-e.lo)+e.rec.length}
  const out=new Uint8Array(size),dv=new DataView(out.buffer);
  let o=0;
  for(const e of keep){
    const b=built.get(e);e.newLo=o;
    if(b){out.set(b.local,o);o+=b.local.length}
    else{out.set(u8.subarray(e.lo,e.end),o);o+=e.end-e.lo}
  }
  const cd=o;
  for(const e of keep){const b=built.get(e),rec=b?b.rec:e.rec;out.set(rec,o);dv.setUint32(o+42,e.newLo,true);o+=rec.length}
  dv.setUint32(o,0x06054b50,true);dv.setUint16(o+8,keep.length,true);dv.setUint16(o+10,keep.length,true);
  dv.setUint32(o+12,o-cd,true);dv.setUint32(o+16,cd,true);
  return out;
}
function saveCopy(f){
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},4000);
  }catch(e){}
}
/* Inside one chapter file: drop everything before the k-th paragraph (as the reader counts them) and return the new file */
async function cutInsideDoc(d0,k,expected){
  const str=await curBook.readText(d0.path);
  if(str==null)throw new Error('could not read that chapter');
  const raw=[],src={nodes:[],doc:null};
  extractChapter(str,d0.path,raw,new Map(),[],src);
  let j=-1;
  if(raw[k]&&raw[k].text===expected)j=k;
  else{let best=1e9;raw.forEach((p,i)=>{if(p.text===expected&&Math.abs(i-k)<best){best=Math.abs(i-k);j=i}})}
  if(j<0||!src.nodes[j])throw new Error('could not find that spot in the chapter file');
  const body=src.doc.body;
  let n=src.nodes[j];
  while(n&&n!==body){
    let prev=n.previousSibling;
    while(prev){const x=prev.previousSibling;prev.parentNode.removeChild(prev);prev=x}
    n=n.parentNode;
  }
  return new TextEncoder().encode('<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(src.doc));
}
/* mode 'chapter': drop the chapters before the one you are in.  mode 'spot': also cut the start of the current chapter, up to where you are */
async function trimRead(mode){
  closePanels();
  if(!curBook||!doc.paras.length)return;
  const spot=mode==='spot';
  const ci=curIndex(),ch=chapters.length?chapterAt(ci):null;
  let d0,k=0;
  if(spot){
    d0=docOfPara(ci);
    if(!d0){toast('Nothing to trim here');return}
    k=doc.paras[ci].k||0;
  }else d0=docOfPara(ch?ch.start:ci);
  const gone=d0?curBook.spineDocs.filter(x=>x.s<d0.s):[];
  if(!gone.length&&!(spot&&k>0)){toast(spot?'There is nothing before this spot to remove':'There are no earlier chapters to remove');return}
  const frNow=frInPara();
  clearTimeout(saveT);lsSet(docKey,posRecord(Math.min(1,reader.scrollTop/maxScroll())));   // make sure the place is saved before the book is reloaded
  try{
    const kept=curBook.spineDocs.filter(x=>x.s>=d0.s);
    const drop=new Set(gone.map(x=>x.path.toLowerCase()));
    /* pictures used only by the removed chapters go too (never covers, never anything a kept chapter or stylesheet uses) */
    const still=new Set();kept.forEach(x=>x.refs.forEach(r=>still.add(r.toLowerCase())));
    let css='';for(const cp of curBook.cssPaths){try{css+=((await curBook.readText(cp))||'').toLowerCase()}catch(e){}}
    for(const x of gone)for(const r of x.refs){
      const l=r.toLowerCase(),base=l.slice(l.lastIndexOf('/')+1);
      if(!still.has(l)&&!/cover/.test(base)&&!css.includes(base))drop.add(l);
    }
    let replace=null;
    if(spot&&k>0){
      const bytes=await cutInsideDoc(d0,k,doc.paras[d0.bases[Math.min(k,d0.bases.length-1)]].text);
      replace=new Map([[d0.path.toLowerCase(),bytes]]);
    }
    const u8=new Uint8Array(await curBook.file.arrayBuffer());
    const out=await trimZip(u8,drop,replace);
    let what=gone.length?gone.length+' earlier chapter file'+(gone.length>1?'s':''):'';
    if(replace){
      const cw=ch?(ch.end>=doc.paras.length?totalWords:cum[ch.end])-cum[ch.start]:0;
      const pct=ch&&cw>0?Math.round((cum[ci]-cum[ch.start])/cw*100):0;
      what+=(what?' and ':'')+(ch&&pct>0?'the first '+pct+'% of "'+ch.title+'"':'the text before this spot in this chapter');
    }
    if(!confirm('Remove '+what+'?\n\n'+fmtSize(u8.length)+' → '+fmtSize(out.length)+
        '. The smaller copy replaces this book on this device and is also downloaded. '+
        'Your place stays; bookmarks inside the removed text are '+(replace?'deleted or hidden.':'hidden.')))return;
    if(replace){
      /* places inside the cut chapter shift by k paragraphs */
      lsSet(docKey,{d:d0.path,s:d0.s,i:0,fr:frNow,f:0});
      bookmarks=bookmarks.filter(b=>!(b.d===d0.path&&b.i<k)).map(b=>b.d===d0.path?Object.assign({},b,{i:b.i-k}):b);
      saveMarks();
    }
    const nf=new File([out],curBook.file.name,{type:'application/epub+zip'});
    saveCopy(nf);
    await openFile(nf);
    toast('Removed '+what+' · '+fmtSize(u8.length)+' → '+fmtSize(out.length),4500);
  }catch(err){toast('Could not trim this book: '+(err&&err.message?err.message:err),4500)}
}
$('#trimBtn').onclick=()=>trimRead('chapter');
$('#trimSpotBtn').onclick=()=>trimRead('spot');

/* ---------- contents ---------- */
function pageOfPara(i){return pageOfWord(cum[i]||0)}
function renderContents(){
  const box=$('#pb-contents');box.replaceChildren();
  if(!doc.paras.length){box.appendChild(mk('div','empty','Open a book to see its contents.'));return}
  if(!toc.length){box.appendChild(mk('div','empty','No chapters found in this book. Use bookmarks or the page stepper to move around.'));return}
  const ci=curIndex();let curT=-1;
  toc.forEach((c,k)=>{if(c.idx<=ci)curT=k});
  toc.forEach((c,k)=>{
    const row=mk('div','item'+(k===curT?' cur':''));
    row.style.paddingLeft=(2+c.depth*16)+'px';
    const g=mk('div','grow');
    g.append(mk('div','t',c.title),mk('div','m','p. '+pageOfPara(c.idx)));
    row.appendChild(g);
    row.onclick=()=>{jumpToPara(c.idx);closePanels()};
    box.appendChild(row);
  });
}

/* ---------- bookmarks ---------- */
function saveMarks(){lsSet('epubr:bm:'+bookId,bookmarks)}
function bookmarksInView(){
  if(!doc.paras.length||!bookmarks.length)return [];
  const w0=wordPos(),span=reader.clientHeight/Math.max(1,spanH)*totalWords;
  return bookmarks.filter(b=>{const w=bmWord(b);return w!=null&&w>=w0-3&&w<=w0+span});
}
/* bookmarks in a chapter that has been deleted stay saved but are hidden */
function liveMarks(){
  return bookmarks.map(b=>({b,w:bmWord(b)})).filter(x=>x.w!=null).sort((a,c)=>a.w-c.w);
}
function addBookmark(){
  if(!doc.paras.length)return;
  if(bookmarksInView().length){toast('Already bookmarked here');return}
  const w=wordPos(),i=curIndex();
  const an=anchorAt(i,Math.min(1,Math.max(0,(w-cum[i])/Math.max(1,wc[i]))));
  bookmarks.push(Object.assign({id:Date.now().toString(36),snip:doc.paras[i].text.slice(0,90),t:Date.now()},an));
  saveMarks();toast('Bookmarked · p. '+pageOfWord(w));
  renderPanels();updateUI();
}
function removeBookmarksInView(){
  const ids=new Set(bookmarksInView().map(b=>b.id));
  bookmarks=bookmarks.filter(b=>!ids.has(b.id));
  saveMarks();toast('Bookmark removed');
  renderPanels();updateUI();
}
function toggleBookmark(){if(bookmarksInView().length)removeBookmarksInView();else addBookmark()}
function renderMarks(){
  const box=$('#pb-marks');box.replaceChildren();
  if(!doc.paras.length){box.appendChild(mk('div','empty','Open a book to add bookmarks.'));return}
  const add=mk('div','addrow'),btn=mk('button',null,'+ Bookmark this spot');
  btn.onclick=addBookmark;add.appendChild(btn);box.appendChild(add);
  const live=liveMarks();
  if(!live.length){box.appendChild(mk('div','empty','No bookmarks yet. The bookmark icon at the top also adds or removes one.'));return}
  for(const {b,w} of live){
    const row=mk('div','item');
    const g=mk('div','grow');
    g.append(mk('div','t',b.snip),mk('div','m','p. '+pageOfWord(w)+' · '+Math.round(w/Math.max(1,totalWords)*100)+'%'));
    const x=mk('button','x','✕');x.setAttribute('aria-label','Delete bookmark');
    x.onclick=ev=>{ev.stopPropagation();bookmarks=bookmarks.filter(m=>m.id!==b.id);saveMarks();renderPanels();updateUI()};
    row.append(g,x);
    row.onclick=()=>{scrollToWord(w);closePanels()};
    box.appendChild(row);
  }
}
$('#bmBtn').onclick=toggleBookmark;

/* ---------- menu tabs ---------- */
menuTab=lsGet('epubr:tab','contents');
function renderPanels(){
  if(menuTab==='contents')renderContents();
  else if(menuTab==='marks')renderMarks();
  else{renderLibrary($('#menuLib'));storeInfo()}
  renderLibrary($('#welcomeLib'));
}
function showTab(t){
  menuTab=t;lsSet('epubr:tab',t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===t));
  for(const k of ['contents','marks','library'])$('#pb-'+k).hidden=(k!==t);
  renderPanels();
  if(t==='contents'){const c=$('#pb-contents .cur');if(c)c.scrollIntoView({block:'center'})}
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#addPdf').onclick=()=>{closePanels();pick()};

/* ---------- top indicator swap + page stepper ---------- */
$('#pct').onclick=()=>{
  S.top=S.top==='page'?'pct':'page';saveSettings();applySettings();updateUI();
  toast('Top shows the '+(S.top==='page'?'page number':'percentage'));
};
function stepPage(d){gotoPage(pageNow()+d,d)}
function bindHold(btn,fn){
  let t1=0,t2=0;
  const halt=()=>{clearTimeout(t1);clearInterval(t2)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();halt();fn();t1=setTimeout(()=>{t2=setInterval(fn,110)},420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,halt));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
document.querySelectorAll('#pager .pgbtn').forEach(b=>bindHold(b,()=>stepPage(parseInt(b.dataset.d,10))));
function updatePager(){
  if(!$('#pager').classList.contains('on'))return;
  const N=pageCount(),n=pageNow();
  $('#pgNow').textContent=n+' / '+N;
  const r=$('#pgRange');r.max=N;if(!pgDrag)r.value=n;
}
$('#pgRange').addEventListener('input',e=>{pgDrag=true;gotoPage(parseInt(e.target.value,10),1)});
$('#pgRange').addEventListener('change',()=>{pgDrag=false;updatePager()});
$('#pgNow').onclick=()=>{
  const v=prompt('Go to page (1–'+pageCount()+'):');
  if(v===null)return;
  const n=parseInt(v,10);
  if(n>=1)gotoPage(n,1);
};

/* ---------- start-up: share target ---------- */
(async()=>{
  renderPanels();
  if(new URLSearchParams(location.search).has('shared')){
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    const f=await takeFile(libUrl('__shared'));
    if(f)openFile(f);
  }
})();

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  try{await deferredInstall.userChoice}catch(e){}
  deferredInstall=null;$('#installBtn').hidden=true;
};
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('Installed')});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

applySettings();
})();
</script>
